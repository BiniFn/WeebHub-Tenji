name: Android APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prebuild Android (Mobile)
        run: npx expo prebuild --platform android --clean
      - name: Build Release APK (Mobile)
        run: |
          cd android && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../weebhub-tenji-v5.0.0.apk
          cd ..
      - name: Prebuild Android (TV)
        run: EXPO_TV=1 npx expo prebuild --platform android --clean
      - name: Build Release APK (TV)
        run: |
          cd android && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../weebhub-tenji-tv-v5.0.0.apk
          cd ..
      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            weebhub-tenji-v5.0.0.apk
            weebhub-tenji-tv-v5.0.0.apk
          fail_on_unmatched_files: true